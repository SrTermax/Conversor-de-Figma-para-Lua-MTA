<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conversor de Figma para Lua MTA</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1e1e1e;
      color: #e0e0e0;
      padding: 16px;
      font-size: 13px;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid #333;
    }
    .header h1 {
      font-size: 16px;
      font-weight: 600;
      background: linear-gradient(135deg, #a855f7, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 4px;
    }
    .header p { font-size: 11px; color: #888; }
    .config-section { margin-bottom: 16px; }
    .config-section label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: #aaa;
      margin-bottom: 6px;
    }
    .config-section input {
      width: 100%;
      padding: 10px 12px;
      background: #2d2d2d;
      border: 1px solid #444;
      border-radius: 6px;
      color: #fff;
      font-size: 13px;
      transition: border-color 0.2s;
    }
    .config-section input:focus { outline: none; border-color: #a855f7; }
    .config-section input::placeholder { color: #666; }
    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 8px;
    }
    .btn-primary {
      background: linear-gradient(135deg, #a855f7, #ec4899);
      color: white;
    }
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(168, 85, 247, 0.4);
    }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
    .loading { display: none; text-align: center; padding: 20px; }
    .loading.visible { display: block; }
    .spinner {
      width: 24px;
      height: 24px;
      border: 3px solid #333;
      border-top-color: #a855f7;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .message {
      padding: 12px;
      border-radius: 6px;
      margin-top: 12px;
      display: none;
    }
    .message.visible { display: block; }
    .error-message {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #ef4444;
    }
    .success-message {
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #22c55e;
    }
    .info-box {
      background: #2d2d2d;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 12px;
      margin-top: 16px;
      font-size: 11px;
      color: #888;
    }
    .info-box h4 { font-size: 11px; font-weight: 600; color: #aaa; margin-bottom: 8px; }
    .info-box ul { list-style: none; padding: 0; }
    .info-box li { margin-bottom: 4px; padding-left: 12px; position: relative; }
    .info-box li::before { content: "•"; position: absolute; left: 0; color: #a855f7; }
    .stats {
      text-align: center;
      font-size: 11px;
      color: #666;
      margin-top: 12px;
      display: none;
    }
    .stats.visible { display: block; }
  </style>
</head>
<body>
  <div class="header">
    <h1>FCL - Figma Convert Lua</h1>
    <p>Conversor de Figma para Lua MTA</p>
  </div>

  <div class="config-section">
    <label for="backgroundName">Nome do Background (Figma)</label>
    <input type="text" id="backgroundName" placeholder="Ex: Background" value="Background" />
  </div>

  <button class="btn btn-primary" id="convertBtn">CONVERTER E BAIXAR ZIP</button>

  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p>Convertendo e gerando ZIP...</p>
  </div>

  <div class="message error-message" id="errorMessage"></div>
  <div class="message success-message" id="successMessage"></div>
  <div class="stats" id="stats"></div>

  <div class="info-box">
    <h4>Instruções</h4>
    <ul>
      <li>Selecione um ou mais frames no Figma</li>
      <li>Clique em "Converter e Baixar ZIP"</li>
      <li>O ZIP será baixado automaticamente</li>
      <li>Para imagens, exporte manualmente do Figma</li>
    </ul>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script>
    const convertBtn = document.getElementById('convertBtn');
    const loading = document.getElementById('loading');
    const errorMessage = document.getElementById('errorMessage');
    const successMessage = document.getElementById('successMessage');
    const stats = document.getElementById('stats');
    const backgroundNameInput = document.getElementById('backgroundName');

    let currentLuaCode = '';
    let currentMetaXML = '';
    let currentImages = [];
    let currentFonts = [];
    let currentResolution = '';

    function hideAll() {
      errorMessage.classList.remove('visible');
      successMessage.classList.remove('visible');
      stats.classList.remove('visible');
    }

    function showError(msg) {
      hideAll();
      loading.classList.remove('visible');
      convertBtn.disabled = false;
      errorMessage.textContent = msg;
      errorMessage.classList.add('visible');
    }

    function showSuccess(msg) {
      successMessage.textContent = msg;
      successMessage.classList.add('visible');
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function sanitizeFileName(name) {
      return name.replace(/\s/g, '_').replace(/[^\w\-.]/g, '');
    }

    async function generateAndDownloadZIP(luaCode, metaXML, images) {
      if (typeof JSZip === 'undefined') {
        showError('Erro: JSZip não carregado. Verifique sua conexão.');
        return;
      }

      const zip = new JSZip();
      zip.file('ProjetoGerado.lua', luaCode);
      zip.file('meta.xml', metaXML);

      if (images.length > 0) {
        const imagesFolder = zip.folder('assets/images');
        for (const img of images) {
          imagesFolder.file(img.name, new Uint8Array(img.data));
        }
      }

      const content = await zip.generateAsync({ type: 'blob' });
      downloadBlob(content, 'ProjetoGerado.zip');
    }

    convertBtn.addEventListener('click', () => {
      const backgroundName = backgroundNameInput.value.trim() || 'Background';
      hideAll();
      loading.classList.add('visible');
      convertBtn.disabled = true;

      parent.postMessage({
        pluginMessage: { type: 'convert', backgroundName }
      }, '*');
    });

    window.onmessage = async (event) => {
      const msg = event.data.pluginMessage;
      if (!msg) return;

      if (msg.type === 'result') {
        currentLuaCode = msg.luaCode;
        currentMetaXML = msg.metaXML;

        stats.textContent = `${msg.nodeCount} nós | ${msg.resolution}`;
        stats.classList.add('visible');

        await generateAndDownloadZIP(currentLuaCode, currentMetaXML, currentImages.length > 0 ? currentImages : []);
        loading.classList.remove('visible');
        convertBtn.disabled = false;
        showSuccess(`ZIP baixado com sucesso! ${msg.nodeCount} nós.`);
      } else if (msg.type === 'images') {
        currentImages = msg.images;
      } else if (msg.type === 'error') {
        showError(msg.message);
      }
    };
  </script>
</body>
</html>
